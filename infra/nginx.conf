events {}

http {
  # Docker's embedded DNS resolver. Using it with variables in proxy_pass
  # forces nginx to re-resolve service names at request time, so it always
  # reaches the CURRENT container IP (survives container recreation/rebuilds).
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "0" always;

    # Frontend (re-resolved per request via the Docker DNS)
    location / {
      set $frontend_upstream http://frontend:3000;
      proxy_pass $frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (re-resolved per request via the Docker DNS)
    location /api/ {
      set $backend_upstream http://backend:3001;
      proxy_pass $backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
