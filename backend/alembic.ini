# Alembic configuration for Video Factory AI.
# The database URL is NOT hard-coded here: it is resolved at runtime from
# app.core.config (Settings.database_url), so the same config works in dev,
# test and production. See alembic/env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally left empty and overridden in env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
